; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Pinned versions: the release build has no cache, so a range takes whatever the registry has that day.
; espressif32 8.x is Arduino 3.x (no esp32/rom/miniz.h), which this firmware has never run on. 7.1.3 pins
; the toolchain itself (recheck on every platform bump) but takes the framework and esptool (which writes
; the signed firmware.bin) as ranges. PlatformIO takes SCons from its own range; listing it here installs
; this version first, and the core then uses it. Bump these together and compare the images before and
; after (RELEASING.md, Known gaps).
platform = platformio/espressif32@7.1.3
platform_packages =
    platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
    platformio/tool-esptoolpy@2.41100.260830
    platformio/tool-scons@4.40801.0
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200

; 1. Force PlatformIO to recognize the physical 16MB Flash
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_cpu = 160000000L

; 2. Use a 16MB partition layout 
; This provides two 4.5MB app slots (for OTA updates) and a massive 5.6MB file system for logging.
board_build.partitions = default_16MB.csv

; 3. Combined build flags (Multi-line format for neatness)
build_flags =
    -DPRINT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Version and build tag come from the git tag (tools/fw_version.py), never from a hand-edited constant.
extra_scripts = tools/pio_version.py

; Compile everything under src_dir EXCEPT Freematics reference sources. None are tracked, but a local copy
; kept here to read must never build: the telelogger targets the Freematics Hub protocol, and the reference
; FreematicsPlus library would collide with our real one in ../libraries.
build_src_filter =
    +<*>
    -<stanleyhuangyc*>
    -<*telelogger*>
    -<*libraries-FreematicsPlus*>

;[env:esp32c3]
;platform = espressif32
;framework = arduino
;board = esp32-c3-devkitm-1
;board_build.mcu = esp32c3
;monitor_speed=115200

[platformio]
src_dir=.

[env]
lib_extra_dirs=../libraries
