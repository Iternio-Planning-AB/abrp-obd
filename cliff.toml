# git-cliff: release notes and the next version, both from Conventional Commits (see AGENTS.md "Etiquette").
# Used by .github/workflows/release.yml; run the same locally with `git cliff --unreleased`.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking and commit.breaking_description != commit.message %} - {{ commit.breaking_description }}{% endif %}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
# A breaking change ships whatever its type (refactor!: ...), so it is never skipped and always bumps major.
protect_breaking_commits = true
# Release candidates are not boundaries: a final's notes cover its whole cycle, and the bump is from the last
# stable release. Pre-semver integer tags (v7) are ignored the same way.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# Only types that change the image release: a docs/chore/test-only history must not mint a new code, since every
# release raises the floor on each dongle that installs it.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking Changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^revert", group = "<!-- 4 -->Reverts" },
  { message = ".*", skip = true },
]

[bump]
# Pre-semver releases were integers up to 7; 1.0.0 encodes to 1000000, above every existing dongle's floor.
initial_tag = "v1.0.0"
features_always_bump_minor = true
breaking_always_bump_major = true
