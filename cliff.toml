# git-cliff: release notes and the next version, both from Conventional Commits (see AGENTS.md "Etiquette").
# Used by .github/workflows/release.yml; run the same locally with `git cliff --unreleased`.

[changelog]
header = ""
body = """
{% macro entry(commit) -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking and commit.breaking_description != commit.message %} - {{ commit.breaking_description }}{% endif %}
{%- endmacro entry %}
{% if previous and previous.version %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
{{ self::entry(commit=commit) }}
{%- endfor %}
{% endfor %}\
{% else %}\
{# No Breaking Changes section on the first release: a breaking commit goes under its own type, footer kept. #}\
{% for title in ["Features", "Bug Fixes", "Performance", "Reverts", "Other Changes"] %}\
{% set_global picked = [] %}\
{% for commit in commits %}\
{% set type = commit.raw_message | split(pat=":") | first | split(pat="(") | first | trim_end_matches(pat="!") %}\
{% if type == "feat" %}{% set t = "Features" %}{% elif type == "fix" %}{% set t = "Bug Fixes" %}\
{% elif type == "perf" %}{% set t = "Performance" %}{% elif type == "revert" %}{% set t = "Reverts" %}\
{% else %}{% set t = "Other Changes" %}{% endif %}\
{% if t == title %}{% set_global picked = picked | concat(with=commit) %}{% endif %}\
{% endfor %}\
{% if picked %}
### {{ title }}
{% for commit in picked %}
{{ self::entry(commit=commit) }}
{%- endfor %}
{% endif %}\
{% endfor %}\
{% endif %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
# A breaking change ships whatever its type (refactor!: ...), so it is never skipped and always bumps major.
protect_breaking_commits = true
# Release candidates are not boundaries: a final's notes cover its whole cycle, and the bump is from the last
# stable release. Pre-semver integer tags (v7) are ignored the same way.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# Only types that change the image release: a docs/chore/test-only history must not mint a new code, since every
# release raises the floor on each dongle that installs it.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking Changes" },
  # A fix to the release workflow is still CI: fix(ci) and feat(ci) change no image.
  { message = "^[a-z]+\\(ci\\)", skip = true },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^revert", group = "<!-- 4 -->Reverts" },
  { message = ".*", skip = true },
]

[bump]
# Pre-semver releases were integers up to 7; 0.1.0 encodes to 1000, above every existing dongle's floor.
initial_tag = "v0.1.0"
features_always_bump_minor = true
# Before 1.0.0 a breaking change bumps minor; 1.0.0 is a deliberate `version` input, not a side effect.
breaking_always_bump_major = false
