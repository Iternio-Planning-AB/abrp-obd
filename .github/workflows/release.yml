# One-press firmware release: pick the version from Conventional Commits, build it, sign it in AWS KMS, publish a
# GitHub Release. See RELEASING.md for the one-time AWS/GitHub setup and for what to do when a run fails.
#
# Only a tag is ever written: the commit being released is the one the run was dispatched on, never a new one, so a
# merge landing mid-run cannot change what gets built or signed.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z (leave blank to derive it from the commits since the last release)"
        type: string
        default: ""
      prerelease:
        description: "Release candidate: tag vX.Y.Z-rc.N and mark it as a prerelease"
        type: boolean
        default: false
      dry_run:
        description: "Build, sign and verify through KMS, then publish nothing (the signed image is not kept)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything downloaded from PyPI and the PlatformIO registry runs here, with a read-only token and no way to
  # reach the signing key: no id-token, no environment, no secrets.
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      name: ${{ steps.version.outputs.name }}
    env:
      PLATFORMIO_VERSION: "6.1.18"
      GIT_CLIFF_VERSION: "2.14.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # every tag: the next version and the notes are computed from them
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # No build cache: the released image must come from a clean toolchain, not whatever a previous run left.
      - name: Install tools
        run: python -m pip install --disable-pip-version-check "platformio==$PLATFORMIO_VERSION" "git-cliff==$GIT_CLIFF_VERSION"

      - name: Check release tooling
        run: python3 tests/run_release_checks.py

      - name: Choose version
        id: version
        env:
          OVERRIDE: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          bumped="$(git cliff --bumped-version)"
          args=(next --bumped "$bumped" --override "$OVERRIDE")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          name="$(python3 baseLogger/tools/fw_version.py "${args[@]}")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Releasing v$name from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        working-directory: baseLogger
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: pio run -e esp32dev -t factory

      - name: Release notes
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p out
          git cliff --unreleased --tag "v$NAME" --strip all > out/notes.md
          cat out/notes.md >> "$GITHUB_STEP_SUMMARY"
          cp baseLogger/.pio/build/esp32dev/{firmware.bin,firmware.elf,factory.bin} out/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned
          path: out/
          retention-days: 1
          if-no-files-found: error

  # Signs what build produced and publishes it. Runs only first-party code from this commit plus the runner's own
  # python3, openssl, aws and gh, so nothing third-party ever holds the OIDC token that can ask KMS for a signature.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # create the tag and the release
      id-token: write   # OIDC token for the KMS signing role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned
          path: dist

      # What the AWS role's trust policy matches on (tf/abrp-obd in cloudops), for when assuming it fails.
      # Only these claims are printed, never the token.
      - name: Show OIDC claims
        if: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          CLAIMS = ("aud", "sub", "ref", "job_workflow_ref", "repository_id", "repository_owner_id")
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          auth = {"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]}
          with urllib.request.urlopen(urllib.request.Request(url, headers=auth)) as r:
              payload = json.load(r)["value"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print(json.dumps({k: claims.get(k) for k in CLAIMS}, indent=2))
          PY

      # Set by cloudops; the role trusts only this workflow file on main of this repo.
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.OTA_SIGNING_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: abrp-obd-release-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true

      # Refuses an image not built as this version or not carrying the trusted key, and self-verifies the signature
      # against Helpers/ota_pubkey.h before writing anything. A dry run stops after this: the signed image is never
      # kept, since it would install on any dongle and raise its floor to an unreleased version.
      - name: Sign
        env:
          NAME: ${{ needs.build.outputs.name }}
          KMS_KEY_ID: ${{ vars.OTA_KMS_KEY_ID }}
        run: |
          python3 baseLogger/tools/ota_sign.py --version-name "$NAME" --kms-key-id "$KMS_KEY_ID" \
            --bin dist/firmware.bin --out dist
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do echo "$v=" >> "$GITHUB_ENV"; done
          (cd dist && sha256sum firmware.bin manifest.json firmware.elf factory.bin > SHA256SUMS)

      # Staged as a draft with every asset in one call: a draft creates no tag and is invisible to a read-only
      # token, so a failure here leaves nothing a dongle could be offered. Published only once complete.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ needs.build.outputs.name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="v$NAME"
          # Fail closed: only a definite "not found" counts as free. A tag without a release would make
          # the release attach to it and ignore --target, publishing on a commit nobody built.
          if out="$(gh release view "$tag" 2>&1)"; then
            echo "::error::a release or draft for $tag already exists; delete the draft or release the next version"
            exit 1
          elif [[ "$out" != *"release not found"* ]]; then
            echo "::error::could not check for an existing $tag release: $out"
            exit 1
          fi
          refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq "map(select(.ref == \"refs/tags/$tag\")) | length")"
          if [ "$refs" != "0" ]; then
            echo "::error::tag $tag already exists without a release"
            exit 1
          fi
          kind=(--latest)
          if [ "$PRERELEASE" = "true" ]; then kind=(--prerelease --latest=false); fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file dist/notes.md \
            dist/firmware.bin dist/manifest.json dist/firmware.elf dist/factory.bin dist/SHA256SUMS
          gh release edit "$tag" --draft=false "${kind[@]}"
          echo "Published $tag" >> "$GITHUB_STEP_SUMMARY"
